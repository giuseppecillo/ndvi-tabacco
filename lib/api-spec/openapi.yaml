openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /variety-templates:
    get:
      operationId: getVarietyTemplates
      parameters:
        - { name: crop, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Same-crop reference profiles for a new proposal
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/VarietyTemplate" } }
  /variety-proposals:
    get:
      operationId: getVarietyProposals
      responses:
        "200":
          description: Approved profiles and own proposals, or all proposals for administrators
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/VarietyProposal" } }
    post:
      operationId: submitVarietyProposal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VarietyProposalInput" }
      responses:
        "201":
          description: Persisted pending proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VarietyProposal" }
  /admin/variety-proposals/{id}/decision:
    post:
      operationId: reviewVarietyProposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VarietyReviewInput" }
      responses:
        "200":
          description: Administrator decision, only pending proposals can change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VarietyProposal" }
  /catalogo-colture:
    get:
      operationId: getCropCatalogue
      summary: Read-only selected crop catalogue, separate from calculation profiles
      responses:
        "200":
          description: Crop names, varieties and display parameters only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CropCatalogue"
        "401": { description: Not signed in }
        "403": { description: Account access requirements not met }
  /auth/setup:
    get:
      operationId: getAccessSetup
      responses:
        "200":
          description: Initial administrator activation availability
          content:
            application/json:
              schema:
                type: object
                required: [activationAvailable]
                properties:
                  activationAvailable: { type: boolean }
  /auth/bootstrap-invite:
    post:
      operationId: sendAdministratorActivation
      responses:
        "200":
          description: Activation email requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /auth/me:
    get:
      operationId: getMyAccount
      responses:
        "200":
          description: Approved account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { description: Not signed in }
        "403": { description: Not authorized or suspended }
  /auth/privacy-ack:
    post:
      operationId: acknowledgePrivacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
      responses:
        "200":
          description: Notice acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /auth/export:
    get:
      operationId: exportMyData
      responses:
        "200":
          description: JSON copy of profile, observations and privacy requests
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /auth/privacy-requests:
    get:
      operationId: listMyPrivacyRequests
      responses:
        "200":
          description: Own privacy requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PrivacyRequest" }
    post:
      operationId: createPrivacyRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, message]
              properties:
                type: { type: string, enum: [erasure, rectification, restriction, objection, access] }
                message: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201":
          description: Request registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyRequest" }
  /admin/users:
    get:
      operationId: listManagedUsers
      responses:
        "200":
          description: Administrator-only account list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
    post:
      operationId: inviteManagedUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManagedUserInvitation"
      responses:
        "201":
          description: Authorized account and invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
  /auth/usage:
    get:
      operationId: getMyUsage
      responses:
        "200":
          description: Own subscription and measured stored-data usage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserUsage" }
  /admin/usage:
    get:
      operationId: listManagedUsage
      responses:
        "200":
          description: Administrator-only aggregates, never observation contents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserUsage" }
  /admin/registrations:
    get:
      operationId: listPendingRegistrations
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Registered identities not yet authorized by an administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingRegistrations" }
  /admin/users/{id}/plan:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: assignManagedPlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanAssignment" }
      responses:
        "200":
          description: Assigned plan or explicitly renewed annual period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserUsage" }
  /usage/maps:
    post:
      operationId: registerGeneratedMap
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeneratedMapInput" }
      responses:
        "200":
          description: Idempotent accounting of a successful map, or quota error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserUsage" }
  /admin/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateManagedUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, suspended] }
                subscriptionDays: { type: integer, minimum: 1, maximum: 3650 }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
    delete:
      operationId: deleteManagedUser
      responses:
        "200":
          description: Account and observations deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /admin/users/{id}/invite:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: resendManagedInvitation
      responses:
        "200":
          description: Invitation requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /admin/privacy-requests:
    get:
      operationId: listManagedPrivacyRequests
      responses:
        "200":
          description: Requests for review by the controller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PrivacyRequest" }
  /admin/privacy-requests/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateManagedPrivacyRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, response]
              properties:
                status: { type: string, enum: [in_progress, completed, rejected] }
                response: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Updated privacy request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyRequest" }
  /admin/audit:
    get:
      operationId: listSecurityEvents
      responses:
        "200":
          description: Last 100 account administration events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, action, createdAt]
                  properties:
                    id: { type: string }
                    action: { type: string }
                    targetId: { type: [string, "null"] }
                    createdAt: { type: string }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    VarietyPhase:
      type: object
      required: [id, label, bbch, azoto, riferimento]
      properties:
        id: { type: string }
        label: { type: string }
        bbch: { type: string }
        azoto: { type: number }
        riferimento: { type: number }
    VarietyProfile:
      type: object
      required: [crop, name, destination, use, earliness, plants, yield, nitrogen, phases]
      properties:
        crop: { type: string }
        name: { type: string }
        destination: { type: string }
        use: { type: string }
        earliness: { type: string }
        plants: { type: number }
        yield: { type: number }
        nitrogen: { type: number }
        phases: { type: array, items: { $ref: "#/components/schemas/VarietyPhase" } }
    VarietyTemplate:
      type: object
      required: [id, referenceName, profile]
      properties:
        id: { type: string }
        referenceName: { type: string }
        profile: { $ref: "#/components/schemas/VarietyProfile" }
    VarietyProposal:
      type: object
      required: [id, crop, name, status, referenceId, referenceName, profile, createdAt, reviewNote]
      properties:
        isOwn: { type: boolean }
        id: { type: string }
        crop: { type: string }
        name: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        referenceId: { type: string }
        referenceName: { type: string }
        profile: { $ref: "#/components/schemas/VarietyProfile" }
        createdAt: { type: string }
        reviewNote: { type: ["string", "null"] }
    VarietyProposalInput:
      type: object
      required: [crop, name, referenceId, phaseNitrogen]
      properties:
        crop: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 100 }
        referenceId: { type: string, minLength: 64, maxLength: 64 }
        phaseNitrogen: { type: array, minItems: 1, maxItems: 12, items: { type: number, minimum: 0, maximum: 1000 } }
    VarietyReviewInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        note: { type: string, maxLength: 500 }
    CropCatalogue:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: array
            items: { type: string }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ManagedUserInvitation:
      type: object
      required: [email, name, plan, startsOn]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        name: { type: string, minLength: 1, maxLength: 120 }
        plan: { type: string, enum: [standard, pro] }
        startsOn: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    PlanAssignment:
      type: object
      required: [plan, startsOn, renew, expectedPeriodId, requestId]
      properties:
        plan: { type: string, enum: [standard, pro] }
        startsOn: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        renew: { type: boolean }
        expectedPeriodId: { type: [string, "null"] }
        requestId: { type: string, format: uuid }
    GeneratedMapInput:
      type: object
      required: [requestId]
      properties:
        requestId: { type: string, format: uuid }
    PlanPeriod:
      type: object
      required: [periodId, plan, startsOn, expiresAt, visitsUsed, mapsUsed]
      properties:
        periodId: { type: string }
        plan: { type: string, enum: [standard, pro] }
        startsOn: { type: string }
        expiresAt: { type: string }
        visitsUsed: { type: integer }
        mapsUsed: { type: integer }
    UserUsage:
      type: object
      required: [userId, planManagementReady, plan, state, periodId, startsOn, expiresAt, visitsUsed, mapsUsed, visitsTotal, observationsTotal, mapsTotal, storageBytes, storageMb, visitsLimit, mapsLimit, storageLimitBytes, trackingSince, periods]
      properties:
        userId: { type: string }
        planManagementReady: { type: boolean }
        plan: { type: string, enum: [standard, pro, unassigned, admin] }
        state: { type: string, enum: [unassigned, scheduled, active, expired, exempt] }
        periodId: { type: [string, "null"] }
        startsOn: { type: [string, "null"] }
        expiresAt: { type: [string, "null"] }
        visitsUsed: { type: [integer, "null"] }
        mapsUsed: { type: [integer, "null"] }
        visitsTotal: { type: integer }
        observationsTotal: { type: integer }
        mapsTotal: { type: integer }
        storageBytes: { type: number }
        storageMb: { type: number }
        visitsLimit: { type: [integer, "null"] }
        mapsLimit: { type: [integer, "null"] }
        storageLimitBytes: { type: [number, "null"] }
        trackingSince: { type: [string, "null"] }
        periods:
          type: array
          items: { $ref: "#/components/schemas/PlanPeriod" }
    PendingRegistration:
      type: object
      required: [email, name, registeredAt]
      properties:
        email: { type: string }
        name: { type: string }
        registeredAt: { type: string }
    PendingRegistrations:
      type: object
      required: [items, nextOffset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PendingRegistration" }
        nextOffset: { type: [integer, "null"] }
    Account:
      type: object
      required: [id, email, name, role, status, privacyAcknowledged, privacyVersion, activated, createdAt, subscriptionExpiresAt, subscriptionDurationDays, subscriptionDaysRemaining, subscriptionExpired, subscriptionExempt]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [admin, user] }
        status: { type: string, enum: [active, suspended, deleting] }
        privacyAcknowledged: { type: boolean }
        privacyVersion: { type: string }
        activated: { type: boolean }
        createdAt: { type: string }
        subscriptionExpiresAt: { type: [string, "null"], format: date-time }
        subscriptionDurationDays: { type: [integer, "null"] }
        subscriptionDaysRemaining: { type: [integer, "null"] }
        subscriptionExpired: { type: boolean }
        subscriptionExempt: { type: boolean }
    PrivacyRequest:
      type: object
      required: [id, userId, type, message, status, response, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        type: { type: string, enum: [erasure, rectification, restriction, objection, access] }
        message: { type: string }
        status: { type: string, enum: [pending, in_progress, completed, rejected] }
        response: { type: string }
        createdAt: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

